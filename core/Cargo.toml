[package]
name = "maelstromssh-core"
description = "SSH/SFTP engine shared by the MaelstromSSH front-ends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
russh = "0.63"
russh-sftp = "3"
vte = "0.15"
unicode-width = "0.2"
# Pinned to the exact version russh 0.63 vendors, purely to turn on the
# `rand_core` (key generation) and `rsa` (RSA key generation) features via
# Cargo feature unification — not an independent dependency on a different
# ssh-key version.
ssh-key = { version = "=0.7.0-rc.11", features = ["rand_core", "getrandom", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "fs", "time"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
dirs = "7"
clap = { version = "4", features = ["derive"], optional = true }
rpassword = { version = "7", optional = true }
tokio-serial = "5.5"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
# CLI argument parsing for `target::TargetArgs`.
clap = ["dep:clap"]
# Terminal prompts (`prompt::TtyPrompter`) for the CLI and TUI.
tty = ["dep:rpassword"]

[dev-dependencies]
tokio-test = "0.4"
anyhow = "1"
