[package]
name = "vortexssh"
version = "0.1.0"
edition = "2021"

[dependencies]
vortexssh-core = { path = "../core", features = ["clap", "tty"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "signal"] }
anyhow = "1"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
