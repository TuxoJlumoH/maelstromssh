[package]
name = "maelstromssh"
description = "SSH/SFTP client for Linux: shell, SFTP, port forwarding, key generation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
maelstromssh-core = { path = "../core", features = ["clap", "tty"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "signal"] }
anyhow = "1"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# `make deb`: builds the whole workspace first, then packages all three
# binaries (cargo deb --no-build).
[package.metadata.deb]
name = "maelstromssh"
maintainer = "TuxoJlumoH <smokie.bg@gmail.com>"
copyright = "2026, TuxoJlumoH"
license-file = ["../LICENSE-MIT", "0"]
extended-description = """\
An SSH and SFTP client with four front-ends: a command-line client \
(maelstromssh), a full-screen terminal UI (maelstromssh-tui), a graphical \
terminal (maelstromssh-gui) and a browser UI served on 127.0.0.1 \
(maelstromssh-web). Supports ssh-agent, key files, keyboard-interactive \
2FA, ~/.ssh/config host aliases, and local/remote/SOCKS port forwarding."""
section = "net"
priority = "optional"
depends = "$auto"
# The GUI loads these at runtime (dlopen), so $auto cannot see them.
recommends = "libegl1, libwayland-client0, libwayland-egl1, libxkbcommon0, libxkbcommon-x11-0, libx11-xcb1, libxcursor1, libxi6"
assets = [
    ["target/release/maelstromssh", "usr/bin/", "755"],
    ["target/release/maelstromssh-tui", "usr/bin/", "755"],
    ["target/release/maelstromssh-gui", "usr/bin/", "755"],
    ["target/release/maelstromssh-web", "usr/bin/", "755"],
    ["../packaging/maelstromssh.desktop", "usr/share/applications/", "644"],
    ["../assets/icon-16.png", "usr/share/icons/hicolor/16x16/apps/maelstromssh.png", "644"],
    ["../assets/icon-24.png", "usr/share/icons/hicolor/24x24/apps/maelstromssh.png", "644"],
    ["../assets/icon-32.png", "usr/share/icons/hicolor/32x32/apps/maelstromssh.png", "644"],
    ["../assets/icon-48.png", "usr/share/icons/hicolor/48x48/apps/maelstromssh.png", "644"],
    ["../assets/icon-64.png", "usr/share/icons/hicolor/64x64/apps/maelstromssh.png", "644"],
    ["../assets/icon-128.png", "usr/share/icons/hicolor/128x128/apps/maelstromssh.png", "644"],
    ["../assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/maelstromssh.png", "644"],
    ["../assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/maelstromssh.png", "644"],
    ["../assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/maelstromssh.svg", "644"],
    ["../README.md", "usr/share/doc/maelstromssh/", "644"],
    ["../HELP.md", "usr/share/doc/maelstromssh/", "644"],
    ["../web/assets/vendor/LICENSE-xterm", "usr/share/licenses/maelstromssh/", "644"],
    ["../web/assets/vendor/LICENSE-xterm-addon-fit", "usr/share/licenses/maelstromssh/", "644"],
]
