name: Release

# Push a tag like v0.2.0 to publish a GitHub release with a tarball and a
# .deb. The tag must match the version in Cargo.toml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # The oldest supported runner, so the binaries need only an old glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - run: cargo test --workspace --locked

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build tarball and .deb
        run: |
          make dist
          make deb
          cd dist && sha256sum *.deb > "$(ls *.deb).sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "MaelstromSSH $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.deb dist/*.deb.sha256
