name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: GUI build dependencies
        run: .github/scripts/install-gui-deps.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GUI build dependencies
        run: .github/scripts/install-gui-deps.sh
      - run: cargo test --workspace --locked

  # `cargo audit` instead of rustsec/audit-check: the action needs
  # check-run write permissions and intermittently fails its GitHub API
  # call ("Resource not accessible by integration" / "Not Found"),
  # turning a clean audit into a red build.
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # Lints the packaging files so a broken .desktop entry or Makefile
  # target is caught before a release.
  packaging:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - run: .github/scripts/install-desktop-utils.sh
      - run: desktop-file-validate packaging/maelstromssh.desktop
      - run: make -n install DESTDIR=/tmp/stage
