[package]
name = "vortexssh-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
vortexssh-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync"] }
tokio-stream = "0.1"
anyhow = "1"
rpassword = "7"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
